services:
  blue-knight:
    build: .
    image: blue-knight-python:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BK_DATA_DIR: /data
    ports:
      - "${PORT:-8080}:${PORT:-8080}/tcp"
      - "${TLS_PORT:-443}:${TLS_PORT:-443}/tcp"
      - "${SS_PORT:-8388}:${SS_PORT:-8388}/tcp"
      - "${SS_PORT:-8388}:${SS_PORT:-8388}/udp"
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      - "${HY2_PORT:-8443}:${HY2_PORT:-8443}/udp"
      - "${TUIC_PORT:-8444}:${TUIC_PORT:-8444}/udp"
    volumes:
      - knight-data:/data
      # For trusted certificates: uncomment, set TLS_CERT/TLS_KEY in .env,
      # and make certificate/key files readable by container UID 10001.
      # - ./certs:/certs:ro
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  knight-data:
